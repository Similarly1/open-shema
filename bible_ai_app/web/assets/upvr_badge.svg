<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="UPVR_Badge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" xml:space="preserve">
  <rect width="24" height="24" rx="3.5" fill="#E63E09"/>
  <!-- Microphone & podcast waves in pure white -->
  <g fill="#FFFFFF">
    <!-- Mic capsule -->
    <rect x="9.5" y="4.5" width="5" height="8.5" rx="2.5"/>
    <!-- Mic base stand -->
    <path d="M7.5,10 C7.5,12.5 9.5,14.5 12,14.5 C14.5,14.5 16.5,12.5 16.5,10" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="12" y1="14.5" x2="12" y2="18" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="9" y1="18" x2="15" y2="18" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Radiating sound waves -->
    <path d="M5,7.5 C4.2,8.8 4.2,11.2 5,12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
    <path d="M19,7.5 C19.8,8.8 19.8,11.2 19,12.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
