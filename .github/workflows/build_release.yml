name: Build and Release Open Shema (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bible_ai_app/requirements.txt
          pip install pyinstaller pywin32

      - name: Build Core Application (OpenShema)
        working-directory: bible_ai_app
        run: |
          python build_executable.py

      - name: Build Windows Installer & Zip Package (OpenShemaSetup.exe & OpenShema.zip)
        working-directory: bible_ai_app
        run: |
          python installer/build_installer.py

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: OpenShema-Release-Binaries
          path: |
            bible_ai_app/dist/OpenShemaSetup.exe
            bible_ai_app/dist/OpenShema.zip

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bible_ai_app/dist/OpenShemaSetup.exe
            bible_ai_app/dist/OpenShema.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
