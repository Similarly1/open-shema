name: Build Open Shema Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bible_ai_app/requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable with PyInstaller
        working-directory: bible_ai_app
        run: |
          python build_executable.py

      - name: Create Release Zip Archive
        run: |
          Compress-Archive -Path bible_ai_app/dist/OpenShema -DestinationPath OpenShema_Windows_x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenShema-Windows-Executable
          path: OpenShema_Windows_x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenShema_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
